name: Weekly deep verification

# The full suite, on a schedule, so slow rot is caught between releases rather than
# at release time. Everything here already runs in CI on push; the difference is
# that this run also audits dependencies and archives a report, and it runs even
# during a quiet week when nobody has pushed.
#
# It reports. It does not repair — no commits, no PRs, no auto-merge.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC, before the working week
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI-only placeholder, matching ci.yml. Never a real secret.
      NEXTAUTH_SECRET: ci-placeholder-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install (lockfile-exact)
        run: npm ci

      - name: Typecheck
        id: typecheck
        run: npm run typecheck
        continue-on-error: true

      - name: Lint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Guard suite
        id: guards
        continue-on-error: true
        run: |
          set +e
          FAILED=""
          PASSED=0
          TOTAL=0
          for f in scripts/*.test.ts; do
            case "$f" in
              *classify.test.ts) echo "skip $f (requires a database)"; continue;;
            esac
            TOTAL=$((TOTAL+1))
            OUT=$(npx tsx "$f" 2>&1)
            if echo "$OUT" | grep -qiE "([1-9][0-9]* failed|FAIL:)"; then
              FAILED="$FAILED $f"
              echo "── FAIL $f"
              echo "$OUT" | grep -iE "FAIL:" | head -5
            else
              PASSED=$((PASSED+1))
            fi
          done
          echo "guards: $PASSED/$TOTAL passed" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -z "$FAILED" ] || { echo "failed:$FAILED" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }

      - name: Production build
        id: build
        run: npm run build
        continue-on-error: true

      - name: Dependency audit (advisory)
        id: audit
        continue-on-error: true
        run: |
          npm audit --audit-level=high --json > audit.json 2>/dev/null || true
          HIGH=$(node -e "try{const a=require('./audit.json');const v=a.metadata?.vulnerabilities||{};console.log((v.high||0)+(v.critical||0))}catch(e){console.log(0)}")
          echo "high/critical advisories: $HIGH" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "high=$HIGH" >> "$GITHUB_OUTPUT"

      - name: Summarise
        run: |
          {
            echo "## Weekly deep verification"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Typecheck | ${{ steps.typecheck.outcome }} |"
            echo "| Lint | ${{ steps.lint.outcome }} |"
            echo "| Guard suite | ${{ steps.guards.outcome }} |"
            echo "| Build | ${{ steps.build.outcome }} |"
            echo "| Dependency audit | ${{ steps.audit.outputs.high }} high/critical |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the weekly issue on failure
        if: steps.typecheck.outcome == 'failure' || steps.guards.outcome == 'failure' || steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Weekly deep verification failing"
        run: |
          set -euo pipefail
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '**Severity: high** — the weekly verification run failed on `%s`.\n\n| Check | Result |\n| --- | --- |\n| Typecheck | %s |\n| Lint | %s |\n| Guards | %s |\n| Build | %s |\n\nRun: %s\n\nThis issue is reused for consecutive failures. Close it once a run is green.' \
            "$(date -u '+%Y-%m-%d')" \
            "${{ steps.typecheck.outcome }}" "${{ steps.lint.outcome }}" \
            "${{ steps.guards.outcome }}" "${{ steps.build.outcome }}" "$RUN")

          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          exit 1
