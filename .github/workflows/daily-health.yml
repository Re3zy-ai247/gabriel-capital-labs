name: Daily health

# Unauthenticated, read-only probe of production. Holds no secrets, so it cannot
# leak one. On failure it maintains exactly ONE open issue (comments on the
# existing one rather than opening a second), so a multi-day outage does not bury
# the board. On success it is silent — a green run should produce no artifact and
# no notification, or the signal stops being read.
#
# Enable/disable: this is schedule + manual dispatch only. Disable from the Actions
# tab; nothing else depends on it.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily
  workflow_dispatch: # manual run, for verifying the workflow itself

permissions:
  contents: read
  issues: write # only to open/comment the single health issue

concurrency:
  group: daily-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Probe production
        id: probe
        run: bash scripts/prod-health.sh
        continue-on-error: true # a failure must reach the issue step, not abort the job

      - name: Report failure to the single health issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Production health check failing"
        run: |
          set -euo pipefail
          REPORT="$(cat health-report.txt 2>/dev/null || echo 'no report produced')"
          WHEN="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          BODY=$(printf '**Severity: high** — an unauthenticated probe of production failed.\n\nChecked at `%s`\n\n```\n%s\n```\n\nRun: %s\n\nThis issue is reused for every consecutive failure. It does not close itself — close it once production is verified healthy.' "$WHEN" "$REPORT" "$RUN")

          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING (no duplicate created)"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Opening the health issue"
            gh issue create --title "$TITLE" --body "$BODY" --label "production" || \
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fail the run when production is unhealthy
        if: steps.probe.outcome == 'failure'
        run: |
          echo "Production health check failed — see the linked issue."
          exit 1
